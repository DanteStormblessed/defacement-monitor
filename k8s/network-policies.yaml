apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-manager-default-deny
spec:
  podSelector:
    matchLabels:
      app: target-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Ajusta esto al namespace/labels de tu Ingress Controller
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5432
