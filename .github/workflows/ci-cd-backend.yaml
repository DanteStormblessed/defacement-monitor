name: ci-backend

on:
  push:
    paths:
      - "target-manager/**"
      - ".github/workflows/ci-cd-backend.yaml"
  pull_request:
    paths:
      - "target-manager/**"

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r target-manager/requirements.txt

      - name: Syntax check
        run: |
          python -m compileall target-manager/app

      - name: Docker build (smoke)
        run: |
          docker build -t defacement-target-manager:ci ./target-manager
